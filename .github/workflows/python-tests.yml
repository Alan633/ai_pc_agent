name: Python Tests

on:
  pull_request:
  push:
    branches:
      - feature/baque-auto-player
      - AIAGENT

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q .

      - name: 运行测试
        run: python -m pytest -q
